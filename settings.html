<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1830"><link rel="stylesheet" href="./css/style.css?v=3"><link rel="manifest" href="./manifest.json"><title>Settings — Quran Listen</title></head>
<body><header class="topbar compact"><a class="back" href="index.html">‹</a><div><p class="eyebrow">SETTINGS</p><h1>Settings</h1></div></header>
<main class="page">
<section class="settings-card card"><h2>Appearance</h2><label>Theme<select id="themeSelect"><option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option></select></label><label>Arabic font size<input id="fontSize" type="range" min="22" max="48" value="32"></label></section>
<section class="settings-card card"><h2>Audio</h2><label class="check"><input id="autoplay" type="checkbox"> Autoplay next Surah</label><label class="check"><input id="repeat" type="checkbox"> Repeat current Surah</label></section>
<section class="settings-card card"><h2>Storage</h2><button id="clearData" class="secondary-btn">Clear local data</button><button id="installBtn" class="primary-btn">Install App</button></section>
<section class="settings-card card"><h2>About & Policies</h2><div class="settings-links"><a href="about.html">About Quran Listen</a><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Use</a><a href="contact.html">Contact</a></div></section>
</main><script src="./js/app.js"></script><script src="./js/settings.js"></script></body></html>
